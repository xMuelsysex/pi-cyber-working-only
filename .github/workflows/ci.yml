name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm run test -- --test-concurrency=1

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Check TypeScript and workflow script syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in index.ts editor-state.ts token-usage.ts working.ts test/*.test.ts; do
            node --experimental-strip-types --check "$file"
          done
          for file in test/*.mjs; do
            node --check "$file"
          done
